<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Street Food Rater</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module">
      const _endpoint = import.meta.env.VITE_ANALYTICS_ENDPOINT;
      const _websiteId = import.meta.env.VITE_ANALYTICS_WEBSITE_ID;
      if (_endpoint && _websiteId) {
        const s = document.createElement('script');
        s.defer = true;
        s.src = `${_endpoint.replace(/\/+$/,'')}/umami`;
        s.setAttribute('data-website-id', _websiteId);
        document.head.appendChild(s);
      }
    </script>
  </body>
</html>
